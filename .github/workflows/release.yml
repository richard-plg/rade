# Release on a vX.Y.Z tag (pushed by scripts/release.sh; docs/RELEASING.md,
# ADR-0012, ADR-0044). The tag's commit only bumps the version and writes the
# changelog, and its parent passed the full CI on its branch, so the release
# does not test the same code again: it checks exactly that, builds the .deb
# from the tag (package.yml: lintian, m10), attests it and publishes a GitHub
# Release with the .deb, SHA256SUMS and the CHANGELOG section as notes.
# Re-running this workflow rebuilds from the tag.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: release commit, version, changelog, parent CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # CI runs of the parent commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: The tag matches Cargo.toml and has a CHANGELOG section
        run: |
          set -euo pipefail
          V=${GITHUB_REF_NAME#v} base=$(scripts/version.sh --base)
          [[ $base == "$V" ]] || { echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $base"; exit 1; }
          notes=$(awk -v v="$V" '$0 ~ "^## \\[" {f = index($0, "## [" v "]") == 1; next} /^\[[^]]+\]: / {next} f' CHANGELOG.md)
          [[ -n ${notes//[[:space:]]/} ]] || { echo "::error::CHANGELOG.md has no section for [$V]"; exit 1; }
          echo "ok: $GITHUB_REF_NAME, CHANGELOG [$V] has $(grep -c '^- ' <<<"$notes") items"
      - name: The tag is a release commit on top of code CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s)
          [[ $subject == "chore(release): $GITHUB_REF_NAME" ]] \
            || { echo "::error::the tag's commit is '$subject', not 'chore(release): $GITHUB_REF_NAME' (scripts/release.sh)"; exit 1; }
          other=$(git diff --name-only HEAD~1 HEAD | grep -vxE 'Cargo\.toml|Cargo\.lock|CHANGELOG\.md' || true)
          [[ -z $other ]] || { echo "::error::the release commit changes more than the version and changelog: $other"; exit 1; }
          parent=$(git rev-parse HEAD~1)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$parent&status=success&per_page=1" --jq .total_count)
          [[ $n -gt 0 ]] || { echo "::error::no successful CI run for the parent commit ${parent:0:7}: release after CI is green"; exit 1; }
          echo "ok: release commit on ${parent:0:7}, CI green there"

  package:
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/package.yml
    with:
      write-cache: true

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the Release, upload assets
      id-token: write # Sigstore signing for the build provenance (public repo)
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rade-deb
          path: dist
      # SLSA build provenance for the .deb (ADR-0042): `gh attestation verify
      # rade_X.Y.Z_amd64.deb -R richard-plg/rade` proves which workflow and
      # commit built it.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.deb
      - name: GitHub Release (ci/publish-release.sh)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/publish-release.sh
