# Release on a vX.Y.Z tag (pushed by scripts/release.sh; docs/RELEASING.md,
# ADR-0012): the full CI from the tag (same image, same gates, the .deb built
# from the tag), then a GitHub Release with the .deb, SHA256SUMS and the
# CHANGELOG section as notes. Re-running this workflow rebuilds from the tag.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the Release, upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rade-deb
          path: dist
      - name: GitHub Release (ci/publish-release.sh)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/publish-release.sh
