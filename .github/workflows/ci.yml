# CI for RADE (ADR-0012, ADR-0042). Public repo → GitHub-hosted runners
# (ubuntu-latest), never a self-hosted one: a pull request from a fork must
# not run code on the owner's machine. Every build and test runs inside
# ci/Dockerfile via the runner's Docker daemon. Nothing is bind-mounted; the
# repo goes in as the build context and results come out with `docker cp`.
# Hosted runners start empty; image layers come from the Actions cache (below).
#
# Also called by release.yml on a v* tag, so a release passes the same gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# A newer push to the same PR cancels the old run; runs on main all finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Image layers are cached in the GitHub Actions cache (type=gha), one scope
  # per target, each job reading all three: the toolchain and libghostty
  # layers (ci/Dockerfile) are rebuilt only when they change. Cache mounts
  # (cargo, zig caches) are not exported, so Rust still builds cold.
  # Host network: Zig's resolver can't parse a scoped IPv6 nameserver Docker
  # may copy into bridge-network build containers; see ci/Dockerfile.
  CACHE_FROM: |
    type=gha,scope=rade-check
    type=gha,scope=rade-e2e
    type=gha,scope=rade-deb
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  commits:
    name: commit messages
    # Not for tags (release.yml calls this on the tag push): main already ran it.
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Conventional Commits with R-IDs (scripts/lint-commits.sh)
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          from=${BASE:-$BEFORE}
          if [[ -z $from || $from =~ ^0+$ ]] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            range="$HEAD -1"   # new branch or force push: the head commit only
          else
            range="$from..$HEAD"
          fi
          echo "range: $range"
          scripts/lint-commits.sh $range

  check:
    name: fmt + clippy + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-flags: --allow-insecure-entitlement network.host
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/Dockerfile
          target: check
          network: host
          allow: network.host
          cache-from: ${{ env.CACHE_FROM }}
          cache-to: type=gha,scope=rade-check,mode=min

  e2e:
    name: E2E (headless Weston)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      E2E_JOBS: 2 # a hosted runner has 4 vCPUs
      E2E_SKIP_PERF: 1 # ms budgets need real hardware (tests/e2e/lib.sh perf_check)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-flags: --allow-insecure-entitlement network.host
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/Dockerfile
          target: e2e
          network: host
          allow: network.host
          load: true
          tags: rade-ci:e2e-${{ github.run_id }}
          cache-from: ${{ env.CACHE_FROM }}
          cache-to: type=gha,scope=rade-e2e,mode=min
      - name: Suites (each in a fresh container; ci/e2e.sh)
        run: ci/e2e.sh "rade-ci:e2e-$GITHUB_RUN_ID" run m2 m3 m4 m5 m6 m7 m8 m9 m11 m12 m13 m14 m14b m15 m15b m16 m24 m26 m28 m29 m30 m31 m34 m36 m37 m38 m39 titles product-recovery settings
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-output
          path: ci-out/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: docker image rm "rade-ci:e2e-$GITHUB_RUN_ID" >/dev/null 2>&1 || true

  package:
    name: .deb + package E2E (m10)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Version and date from git (.git is not in the build context)
        id: version
        run: |
          echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-flags: --allow-insecure-entitlement network.host
      - name: Build the .deb (scripts/package-deb.sh in the CI image)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/Dockerfile
          target: deb
          network: host
          allow: network.host
          load: true
          tags: rade-ci:deb-${{ github.run_id }}
          build-args: |
            RADE_VERSION=${{ steps.version.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.version.outputs.epoch }}
          cache-from: ${{ env.CACHE_FROM }}
          cache-to: type=gha,scope=rade-deb,mode=min
      - name: Copy the .deb out of the image
        env:
          version: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          c=$(docker create "rade-ci:deb-$GITHUB_RUN_ID")
          mkdir -p dist && docker cp "$c:/src/target/debian/." dist/ && docker rm "$c" >/dev/null
          ls -l dist
          test "$(ls dist/*.deb)" = "dist/rade_${version}_amd64.deb"
      - name: Package E2E (tests/e2e/m10.sh)
        run: ci/e2e.sh "rade-ci:deb-$GITHUB_RUN_ID" m10
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rade-deb
          path: dist/*.deb
          retention-days: 30
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m10-output
          path: ci-out/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: docker image rm "rade-ci:deb-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
