# CI for RADE (ADR-0012, ADR-0042, ADR-0044). Public repo → GitHub-hosted
# runners (ubuntu-latest), never a self-hosted one: a pull request from a fork
# must not run code on the owner's machine. Every build and test runs inside
# ci/Dockerfile via the runner's Docker daemon; the repo goes in as the build
# context and results come out with `docker cp`.
#
# Image layers (toolchain, libghostty, the release build) are cached on
# ghcr.io/richard-plg/rade-ci as a registry cache, one tag per target: unlike
# the 10 GB Actions cache it isn't evicted. Pushes write it; pull requests only
# read it. Cache mounts (cargo, zig caches) are not exported, so Rust builds
# cold. Host network: Zig's resolver can't parse a scoped IPv6 nameserver
# Docker may copy into bridge-network build containers; see ci/Dockerfile.
#
# A release commit (`chore(release): vX.Y.Z`, pushed with its tag by
# scripts/release.sh) is not tested here: it only bumps the version and the
# changelog, release.yml checks that, requires this workflow to have passed on
# its parent commit, and builds the .deb from the tag.
name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the old run; runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  # Every other job needs this one: it decides whether the push is a release
  # commit (then nothing runs) and lints the new commits.
  commits:
    name: commit messages
    if: >-
      ${{ !(github.event_name == 'push'
      && startsWith(github.event.head_commit.message, 'chore(release): v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Conventional Commits with R-IDs (scripts/lint-commits.sh)
        if: github.event_name != 'workflow_dispatch'
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          from=${BASE:-$BEFORE}
          if [[ -z $from || $from =~ ^0+$ ]] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            range="$HEAD -1"   # new branch or force push: the head commit only
          else
            range="$from..$HEAD"
          fi
          echo "range: $range"
          scripts/lint-commits.sh $range

  check:
    name: fmt + clippy + unit tests
    needs: commits
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # the layer cache on ghcr.io (read-only on a fork's PR)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-flags: --allow-insecure-entitlement network.host
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/Dockerfile
          target: check
          network: host
          allow: network.host
          cache-from: |
            type=registry,ref=ghcr.io/richard-plg/rade-ci:cache-check
            type=registry,ref=ghcr.io/richard-plg/rade-ci:cache-e2e
          cache-to: ${{ github.event_name == 'push' && 'type=registry,ref=ghcr.io/richard-plg/rade-ci:cache-check,mode=max' || '' }}

  # The suites in three shards, split by their CI durations (greedy, slowest
  # first; ~5 min of suites each). A new suite goes into the lightest shard.
  e2e:
    name: E2E ${{ matrix.shard }} (headless Weston)
    needs: commits
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            suites: m37 m29 m14 m13 m2 m7 product-recovery m3 m12 m34 m48 m50
          - shard: b
            suites: m6 m8 m14b m11 m4 m9 titles m26 m15 m36 m5 m45 m47
          - shard: c
            suites: m30 m28 m39 m15b m24 m31 m38 m16 run settings m46 m49
    env:
      E2E_JOBS: 2 # a hosted runner has 4 vCPUs
      E2E_SKIP_PERF: 1 # ms budgets need real hardware (tests/e2e/lib.sh perf_check)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-flags: --allow-insecure-entitlement network.host
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/Dockerfile
          target: e2e
          network: host
          allow: network.host
          load: true
          tags: rade-ci:e2e-${{ github.run_id }}
          cache-from: |
            type=registry,ref=ghcr.io/richard-plg/rade-ci:cache-e2e
            type=registry,ref=ghcr.io/richard-plg/rade-ci:cache-check
          # One shard writes; the three build the same layers.
          cache-to: ${{ github.event_name == 'push' && matrix.shard == 'a' && 'type=registry,ref=ghcr.io/richard-plg/rade-ci:cache-e2e,mode=max' || '' }}
      - name: Suites (each in a fresh container; ci/e2e.sh)
        run: ci/e2e.sh "rade-ci:e2e-$GITHUB_RUN_ID" ${{ matrix.suites }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-output-${{ matrix.shard }}
          path: ci-out/
          retention-days: 7
          if-no-files-found: ignore

  package:
    needs: commits
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/package.yml
    with:
      write-cache: ${{ github.event_name == 'push' }}
