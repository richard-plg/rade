# Contrast pairs, checked in both themes: "<ink> on <background>… [over <base>]"
# (a translucent background is composited over its base). From the "On" column of
# the spec README and spec A.78 / A.79.
[contrast]
text = [
  "fg on bg0 bg1 bg2 bg3",
  "fg2 on bg0 bg1 bg2 bg3",
  "fg3 on bg0 bg1 bg2 bg3",
  "fg on acc-dim over bg1",
  "fg2 on acc-dim over bg1",
  "fg3 on acc-dim over bg1",
  "fg on wait-dim over bg1",
  "fg2 on wait-dim over bg1",
  "acc on bg0 bg1 bg2 bg3",
  "acc on acc-dim over bg1",
  "acc on acc-dim over bg2",
  "acc-fg on acc",
  "wait on bg0 bg1 bg2 bg3",
  "wait on wait-dim over bg1",
  "wait on wait-dim over bg2",
  "run on bg0 bg1 bg2 bg3",
  "ok on bg0 bg1 bg2 bg3",
  "err on bg0 bg1 bg2 bg3",
  "add on bg0 bg1 bg2 bg3",
  "del on bg0 bg1 bg2 bg3",
  "agent-claude on agent-claude-bg over bg2",
  "agent-codex on bg4",
  "term-fg on bg0",
  "term-1 on bg0",
  "term-2 on bg0",
  "term-3 on bg0",
  "term-4 on bg0",
  "term-5 on bg0",
  "term-6 on bg0",
  "term-8 on bg0",
  "term-9 on bg0",
  "term-10 on bg0",
  "term-11 on bg0",
  "term-12 on bg0",
  "term-13 on bg0",
  "term-14 on bg0",
  "term-fg on term-sel",
  "syn-comment on bg0 bg1",
  "syn-keyword on bg0 bg1",
  "syn-string on bg0 bg1",
  "syn-constant on bg0 bg1",
  "syn-function on bg0 bg1",
  "syn-type on bg0 bg1",
  "syn-tag on bg0 bg1",
  "syn-invalid on bg0 bg1",
]
glyph = [
  "wt on bg0 bg1 bg2 bg3",
  "proj-1 on bg1 bg3",
  "proj-2 on bg1 bg3",
  "proj-3 on bg1 bg3",
  "wait on bg0 bg1",
  "run on bg0 bg1",
  "ok on bg0 bg1",
  "err on bg0 bg1",
  "fg3 on bg0 bg1",
]
